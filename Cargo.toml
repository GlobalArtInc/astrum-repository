[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "3.0.0-dev"
edition = "2024"
rust-version = "1.98"
publish = false
repository = "https://github.com/GlobalArtInc/astrum-repository"

[workspace.dependencies]
astrum-api = { path = "crates/astrum-api" }
astrum-db = { path = "crates/astrum-db" }
astrum-server = { path = "crates/astrum-server" }
astrum-testkit = { path = "crates/astrum-testkit" }

anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
migrator = { package = "sqlmig", version = "0.2.1" }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "fs", "time"] }
toml = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
