

# internal layout defaults
karaf.home=.
karaf.base=.
karaf.data=../globalart-work/astrum3
karaf.instances=${karaf.data}/instances
fabric.etc=${karaf.base}/etc/fabric
jetty.etc=${karaf.base}/etc/jetty
karaf.etc=${karaf.base}/etc/karaf
logback.etc=${karaf.base}/etc/logback
ssl.etc=${karaf.base}/etc/ssl

# astrum defaults should go in astrum-default.properties

## DO NOT EDIT - CUSTOMIZATIONS BELONG IN $data-dir/etc/astrum.properties
##
# Jetty section
application-port=8081
application-host=0.0.0.0
#astrum-args=${jetty.etc}/jetty.xml,${jetty.etc}/jetty-http.xml,${jetty.etc}/jetty-requestlog.xml
astrum-args=${jetty.etc}/jetty.xml,${jetty.etc}/jetty-http.xml
astrum-context-path=/

# Astrum section
astrum-features=\
 astrum-core-feature

